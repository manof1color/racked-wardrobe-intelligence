version: 1
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - pnpm install --frozen-lockfile
    build:
      commands:
        # Judge note: Amplify exposes console variables to the build container, but
        # Next.js SSR needs an allowlisted .env.production file in the deployment
        # artifact. The helper writes values without printing them to build logs.
        - node scripts/write-amplify-env.mjs
        - pnpm build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
