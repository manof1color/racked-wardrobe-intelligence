<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1120" role="img" aria-label="Racked — system architecture" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1200" height="1120" rx="24" fill="#f5f2ea"/>
  <title>Racked — system architecture</title>
  <desc>A browser enters AWS Amplify Hosting through a session and role check. A shared bus reaches photo intake, Hanger, and the privacy gate. Intake and Hanger call Amazon Bedrock; Hanger also calls Open-Meteo and the outfit builder. Three straight drops reach an owner-scoped store backed by DynamoDB and private S3. Only the privacy gate crosses the boundary to release aggregates to brands.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#171914"/>
    </marker>
    <marker id="privacy-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#e94f30"/>
    </marker>
  </defs>
  <g fill="#171914">
    <text x="30" y="50" font-size="32" font-weight="750">Racked — system architecture</text>
    <text x="30" y="84" font-size="22">One door to brands: the privacy gate.</text>
    <g font-size="20">
      <circle cx="716" cy="71" r="8" fill="#cfc5ff"/><text x="733" y="78">AI</text>
      <circle cx="794" cy="71" r="8" fill="#ff6846"/><text x="811" y="78">privacy</text>
      <circle cx="912" cy="71" r="8" fill="#b8ddb7"/><text x="929" y="78">storage</text>
      <circle cx="1050" cy="71" r="8" fill="#d5f66d"/><text x="1067" y="78">external</text>
    </g>
  </g>
  <g id="amplify">
    <rect x="30" y="310" width="870" height="615" rx="20" fill="#ece6d8" stroke="#d9d4c8" stroke-width="2"/>
    <text x="115" y="350" font-size="26" font-weight="700" fill="#171914"><tspan x="115">AWS Amplify</tspan><tspan x="115" dy="32">Hosting</tspan></text>
    <text x="115" y="414" font-size="20" fill="#716f68"><tspan x="115">Next.js 15</tspan><tspan x="115" dy="27">server rendering</tspan><tspan x="115" dy="27">and API routes</tspan></text>
  </g>

  <!-- Exactly fourteen directed connections. The shared Session bus is an intentional fan-out. -->
  <g fill="none" stroke="#171914" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path id="edge-client-entry" data-from="client" data-to="entry" d="M 505 260 V 370" marker-end="url(#arrow)"/>
    <path id="edge-entry-intake" data-from="entry" data-to="intake" d="M 505 458 V 490 H 170 V 540" marker-end="url(#arrow)"/>
    <path id="edge-entry-hanger" data-from="entry" data-to="hanger" d="M 505 458 V 490 H 480 V 540" marker-end="url(#arrow)"/>
    <path id="edge-entry-gate" data-from="entry" data-to="gate" d="M 505 458 V 490 H 770 V 540" marker-end="url(#arrow)"/>
    <path id="edge-hanger-builder" data-from="hanger" data-to="builder" d="M 550 670 V 700" marker-end="url(#arrow)"/>
    <path id="edge-intake-store" data-from="intake" data-to="store" d="M 170 670 V 805" marker-end="url(#arrow)"/>
    <path id="edge-hanger-store" data-from="hanger" data-to="store" d="M 480 670 V 805" marker-end="url(#arrow)"/>
    <path id="edge-gate-store" data-from="gate" data-to="store" d="M 770 670 V 805" marker-end="url(#arrow)"/>
    <path id="edge-intake-bedrock" data-from="intake" data-to="bedrock" d="M 80 540 V 260" marker-end="url(#arrow)"/>
    <!-- Two and only two bridge hops, each over the Session bus; halos make crossings non-junctions. -->
    <path d="M 300 498 Q 288 490 300 482" stroke="#ece6d8" stroke-width="10"/>
    <path id="edge-hanger-bedrock" data-from="hanger" data-to="bedrock" d="M 375 540 V 515 H 300 V 498 Q 288 490 300 482 V 278 H 295 V 260" marker-end="url(#arrow)"/>
    <path d="M 675 498 Q 687 490 675 482" stroke="#ece6d8" stroke-width="10"/>
    <path id="edge-hanger-weather" data-from="hanger" data-to="weather" d="M 585 540 V 525 H 675 V 498 Q 687 490 675 482 V 278 H 1030 V 260" marker-end="url(#arrow)"/>
    <path id="edge-store-dynamodb" data-from="store" data-to="dynamodb" d="M 270 890 V 955" marker-end="url(#arrow)"/>
    <path id="edge-store-s3" data-from="store" data-to="s3" d="M 660 890 V 955" marker-end="url(#arrow)"/>
    <path id="edge-gate-brands" data-from="gate" data-to="brands" d="M 880 600 H 940" stroke="#e94f30" stroke-width="4" marker-end="url(#privacy-arrow)"/>
  </g>
  <text x="325" y="280" font-size="20" fill="#171914"><tspan x="325">HTTPS · signed</tspan><tspan x="325" dy="24">HTTP-only session</tspan></text>

  <g id="client">
    <rect x="370" y="140" width="300" height="120" rx="14" fill="#fffdf8" stroke="#d9d4c8" stroke-width="2"/>
    <text x="392" y="177" font-size="26" font-weight="700" fill="#171914"><tspan x="392">Phone or desktop</tspan><tspan x="392" dy="31">browser</tspan></text>
    <text x="392" y="239" font-size="20" fill="#716f68">Installable PWA</text>
  </g>
  <g id="bedrock">
    <rect x="55" y="140" width="295" height="120" rx="14" fill="#cfc5ff"/>
    <text x="77" y="177" font-size="26" font-weight="700" fill="#171914">Amazon Bedrock</text>
    <text x="77" y="205" font-size="20" fill="#171914"><tspan x="77">Nova Pro: garment</tspan><tspan x="77" dy="23">detection + Hanger</tspan><tspan x="77" dy="23">Nova Lite fallback</tspan></text>
  </g>
  <g id="weather">
    <rect x="890" y="140" width="280" height="120" rx="14" fill="#d5f66d"/>
    <text x="912" y="177" font-size="26" font-weight="700" fill="#171914">Open-Meteo</text>
    <text x="912" y="209" font-size="20" fill="#171914"><tspan x="912">Coordinates rounded</tspan><tspan x="912" dy="26">to ~1 km</tspan></text>
  </g>
  <g id="entry">
    <rect x="355" y="370" width="300" height="88" rx="14" fill="#fffdf8" stroke="#d9d4c8" stroke-width="2"/>
    <text x="375" y="407" font-size="26" font-weight="700" fill="#171914">Session &amp; role check</text>
    <text x="375" y="438" font-size="20" fill="#716f68">Rate limits</text>
  </g>
  <g id="intake">
    <rect x="55" y="540" width="230" height="130" rx="14" fill="#cfc5ff"/>
    <text x="77" y="578" font-size="26" font-weight="700" fill="#171914">Photo intake</text>
    <text x="77" y="612" font-size="20" fill="#171914"><tspan x="77">One bounded crop</tspan><tspan x="77" dy="26">per piece</tspan></text>
  </g>
  <g id="hanger">
    <rect x="345" y="540" width="270" height="130" rx="14" fill="#cfc5ff"/>
    <text x="367" y="578" font-size="26" font-weight="700" fill="#171914">Hanger agents</text>
    <text x="367" y="604" font-size="20" fill="#171914"><tspan x="367">wardrobe search ·</tspan><tspan x="367" dy="24">outfit builder ·</tspan><tspan x="367" dy="24">weather · trends</tspan></text>
  </g>
  <g id="builder">
    <rect x="535" y="700" width="220" height="70" rx="14" fill="#fffdf8" stroke="#d9d4c8" stroke-width="2"/>
    <text x="555" y="731" font-size="26" font-weight="700" fill="#171914">Outfit builder</text>
    <text x="555" y="756" font-size="20" fill="#716f68">Stylist knowledge</text>
  </g>
  <g id="gate">
    <rect x="660" y="540" width="220" height="130" rx="14" fill="#ff6846"/>
    <text x="680" y="578" font-size="26" font-weight="700" fill="#171914">Privacy gate</text>
    <text x="680" y="604" font-size="20" fill="#171914"><tspan x="680">Consent → k ≥ 25 →</tspan><tspan x="680" dy="24">enumeration</tspan><tspan x="680" dy="24">budget</tspan></text>
  </g>
  <g id="store">
    <rect x="55" y="805" width="810" height="85" rx="14" fill="#b8ddb7"/>
    <text x="77" y="842" font-size="28" font-weight="700" fill="#171914">Owner-scoped store</text>
    <text x="77" y="874" font-size="20" fill="#171914">Every read checks the account</text>
  </g>
  <path id="privacy-boundary" d="M 900 310 V 925" fill="none" stroke="#e94f30" stroke-width="3" stroke-dasharray="9 8"/>
  <text x="919" y="434" transform="rotate(-90 919 434)" text-anchor="middle" font-size="20" font-weight="650" fill="#e94f30">privacy boundary</text>
  <g id="brands">
    <rect x="940" y="540" width="230" height="130" rx="14" fill="#ff6846"/>
    <text x="960" y="576" font-size="26" font-weight="700" fill="#171914"><tspan x="960">Brand</tspan><tspan x="960" dy="29">dashboard</tspan></text>
    <text x="960" y="634" font-size="20" fill="#171914"><tspan x="960">Released aggregates</tspan><tspan x="960" dy="24">only</tspan></text>
  </g>
  <text x="940" y="711" font-size="20" font-weight="650" fill="#171914"><tspan x="940">Never names, emails,</tspan><tspan x="940" dy="27">photos, wardrobes,</tspan><tspan x="940" dy="27">or owner IDs</tspan></text>
  <g id="dynamodb">
    <rect x="135" y="955" width="270" height="75" rx="14" fill="#b8ddb7"/>
    <text x="157" y="989" font-size="26" font-weight="700" fill="#171914">DynamoDB</text>
    <text x="157" y="1018" font-size="20" fill="#171914">single table</text>
  </g>
  <g id="s3">
    <rect x="525" y="955" width="285" height="75" rx="14" fill="#b8ddb7"/>
    <text x="547" y="989" font-size="26" font-weight="700" fill="#171914">Private S3</text>
    <text x="547" y="1018" font-size="20" fill="#171914">encrypted · 1-hour links</text>
  </g>
  <rect x="30" y="1045" width="1140" height="65" rx="14" fill="#fffdf8" stroke="#d9d4c8" stroke-width="2"/>
  <text x="52" y="1073" font-size="20" fill="#171914"><tspan x="52">Pull request → CI: audit · lint · type check · tests · build + CodeQL</tspan><tspan x="52" dy="26">→ merge to main → Amplify builds → /api/version reports the commit</tspan></text>
</svg>
