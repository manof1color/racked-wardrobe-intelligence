name: Bug report
description: Report a reproducible problem in the Racked demo.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Racked. Never include credentials, PII, or private wardrobe images.

        Privacy or access-control problems — exposed identifiers, a brand seeing consumer data, a bypassed threshold — should go through the [private security policy](https://github.com/manof1color/racked-wardrobe-intelligence/security/policy) instead of a public issue.
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Consumer wardrobe, Looks, and saved outfits
        - Garment enrollment, photo plan, and analysis
        - Hanger conversation (Consumer or Brand)
        - Community feed
        - Brand wear intelligence and aggregates
        - Partner dashboards
        - Authentication, rate limits, and access control
        - Pricing page
        - Documentation or deployment
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the smallest sequence that consistently shows the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, device, route, and commit SHA if known.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, credentials, PII, and private images from this report.
          required: true
